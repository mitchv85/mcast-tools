name: Publish to PyPI

on:
  # Tag push is the normal release path: `git tag v0.2.0 && git push --tags`
  push:
    tags:
      - "v*"
  # Manual trigger from the Actions UI, useful for the very first publish or
  # re-running a failed release. Publishes whatever pyproject.toml currently
  # declares as the version.
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    # The `pypi` environment name MUST match the Environment name configured
    # on PyPI under "Trusted publisher" / "Pending publisher" for this project.
    environment:
      name: pypi
      url: https://pypi.org/project/mcast-tools/
    permissions:
      # `id-token: write` is REQUIRED for PyPI Trusted Publishing (OIDC).
      id-token: write
      # `contents: write` lets the workflow create a GitHub Release.
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Verify tag matches pyproject.toml version
        # Only run this when the workflow was triggered by a tag push. For
        # `workflow_dispatch` runs we trust the human who clicked the button.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Tag version:        ${TAG_VERSION}"
          echo "pyproject version:  ${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${PKG_VERSION}"
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: List built artifacts
        run: ls -la dist/

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        # Only attach a GitHub Release when we were triggered by a tag push —
        # workflow_dispatch runs against a branch, not a tag, so there's no
        # tag to attach a Release to.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
